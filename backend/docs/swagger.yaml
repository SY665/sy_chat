basePath: /api/v1
definitions:
  handlers.AuthData:
    properties:
      user:
        $ref: '#/definitions/handlers.AuthUserData'
    type: object
  handlers.AuthUserData:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  handlers.BatchDeleteConversationsData:
    properties:
      deletedCount:
        type: integer
    type: object
  handlers.BatchDeleteConversationsRequest:
    properties:
      ids:
        items:
          type: string
        type: array
    required:
    - ids
    type: object
  handlers.ChatData:
    properties:
      assistantMessage:
        $ref: '#/definitions/handlers.ChatMessageData'
      userMessage:
        $ref: '#/definitions/handlers.ChatMessageData'
    type: object
  handlers.ChatMessageData:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.FileAttachment'
        type: array
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      role:
        type: string
      thinking:
        type: string
      toolEvents:
        items:
          $ref: '#/definitions/handlers.ToolEventData'
        type: array
    type: object
  handlers.ChatRequest:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.FileAttachment'
        type: array
      conversationId:
        type: string
      enableThinking:
        type: boolean
      enableWebSearch:
        type: boolean
      message:
        type: string
      modelId:
        description: 允许旧版请求不传模型，由 Service 使用默认模型。
        type: string
    required:
    - conversationId
    - message
    type: object
  handlers.ConversationDeleteData:
    properties:
      id:
        type: string
      message:
        type: string
    type: object
  handlers.ConversationDetailData:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isPinned:
        type: boolean
      isShared:
        type: boolean
      messages:
        items:
          $ref: '#/definitions/handlers.ConversationMessageData'
        type: array
      shareToken:
        type: string
      sharedAt:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  handlers.ConversationListData:
    properties:
      conversations:
        items:
          $ref: '#/definitions/handlers.ConversationSummaryData'
        type: array
    type: object
  handlers.ConversationMessageData:
    properties:
      attachments:
        items:
          $ref: '#/definitions/models.FileAttachment'
        type: array
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      role:
        type: string
      thinking:
        type: string
      toolEvents:
        items:
          $ref: '#/definitions/handlers.ToolEventData'
        type: array
    type: object
  handlers.ConversationPinnedData:
    properties:
      id:
        type: string
      isPinned:
        type: boolean
    type: object
  handlers.ConversationShareData:
    properties:
      shareToken:
        type: string
      sharedAt:
        type: string
    type: object
  handlers.ConversationSummaryData:
    properties:
      createdAt:
        type: string
      id:
        type: string
      isPinned:
        type: boolean
      title:
        type: string
      updatedAt:
        type: string
    type: object
  handlers.ConversationTitleData:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  handlers.ConversationUnshareData:
    properties:
      id:
        type: string
      isShared:
        type: boolean
    type: object
  handlers.CreateConversationRequest:
    properties:
      title:
        type: string
    type: object
  handlers.GeneratedImageData:
    properties:
      height:
        type: integer
      url:
        type: string
      width:
        type: integer
    type: object
  handlers.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      identifier:
        type: string
      password:
        type: string
    required:
    - identifier
    - password
    type: object
  handlers.ModelData:
    properties:
      id:
        type: string
      name:
        type: string
      provider:
        type: string
      supportsThinking:
        type: boolean
    type: object
  handlers.ModelListData:
    properties:
      defaultModelId:
        type: string
      models:
        items:
          $ref: '#/definitions/handlers.ModelData'
        type: array
      webSearchAvailable:
        type: boolean
    type: object
  handlers.PublicShareData:
    properties:
      messages:
        items:
          $ref: '#/definitions/handlers.PublicShareMessageData'
        type: array
      ownerName:
        type: string
      sharedAt:
        type: string
      title:
        type: string
      viewCount:
        type: integer
    type: object
  handlers.PublicShareMessageData:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: string
      role:
        type: string
      thinking:
        type: string
      toolEvents:
        items:
          $ref: '#/definitions/handlers.ToolEventData'
        type: array
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 30
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  handlers.SearchSourceData:
    properties:
      snippet:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  handlers.ToolEventData:
    properties:
      image:
        $ref: '#/definitions/handlers.GeneratedImageData'
      name:
        type: string
      sources:
        items:
          $ref: '#/definitions/handlers.SearchSourceData'
        type: array
      status:
        type: string
      toolCallId:
        type: string
    type: object
  handlers.TruncateMessagesData:
    properties:
      conversationId:
        type: string
      deletedCount:
        type: integer
      messageId:
        type: string
    type: object
  handlers.UpdateConversationPinnedRequest:
    properties:
      isPinned:
        description: 使用指针区分 false 和请求中没有传入 isPinned。
        type: boolean
    required:
    - isPinned
    type: object
  handlers.UpdateConversationTitleRequest:
    properties:
      title:
        type: string
    required:
    - title
    type: object
  models.FileAttachment:
    properties:
      content:
        type: string
      name:
        type: string
      size:
        type: integer
      type:
        type: string
    type: object
  response.APIError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.APIError'
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    SY Chat 的认证、会话、聊天、模型和分享接口。
    登录成功后，浏览器通过 sy_chat_session HttpOnly Cookie 自动访问受保护接口。
  title: SY Chat API
  version: "1.0"
paths:
  /attachments:
    post:
      consumes:
      - multipart/form-data
      description: 读取不超过 1 MB 的 .txt 或 .md 文件。
      parameters:
      - description: 文本附件
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/models.FileAttachment'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 上传文本附件
      tags:
      - Attachments
  /auth/login:
    post:
      consumes:
      - application/json
      description: 验证用户名或邮箱和密码，并写入 sy_chat_session HttpOnly Cookie。
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 登录
      tags:
      - Auth
  /auth/logout:
    post:
      description: 删除浏览器中的 sy_chat_session 登录 Cookie。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 退出登录
      tags:
      - Auth
  /auth/me:
    get:
      description: 根据 sy_chat_session 登录 Cookie 返回当前用户信息。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.AuthData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 获取当前用户
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 创建用户，并通过 HttpOnly Cookie 自动建立登录会话。
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 注册用户
      tags:
      - Auth
  /chat:
    post:
      consumes:
      - application/json
      description: 保存用户消息，并以普通 JSON 响应返回完整的 AI 回复。
      parameters:
      - description: 聊天参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ChatData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/response.Envelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 发送聊天消息
      tags:
      - Chat
  /chat/stream:
    post:
      consumes:
      - application/json
      description: 使用 SSE 返回思考内容、工具状态、增量正文和最终消息。事件包括 thinking、tool、chunk、done 和 error。
      parameters:
      - description: 聊天参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流：thinking、tool、chunk、done、error
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
        "501":
          description: Not Implemented
          schema:
            $ref: '#/definitions/response.Envelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 流式发送聊天消息
      tags:
      - Chat
  /conversations:
    get:
      description: 返回当前登录用户的全部对话，置顶对话优先排列。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationListData'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 获取对话列表
      tags:
      - Conversations
    post:
      consumes:
      - application/json
      description: 为当前登录用户创建一个新对话；标题为空时使用默认标题。
      parameters:
      - description: 创建对话参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateConversationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationSummaryData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 创建对话
      tags:
      - Conversations
  /conversations/{id}:
    delete:
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationDeleteData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 删除对话
      tags:
      - Conversations
    get:
      description: 返回指定对话及其全部消息。
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationDetailData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 获取对话详情
      tags:
      - Conversations
    patch:
      consumes:
      - application/json
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      - description: 新标题
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateConversationTitleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationTitleData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 修改对话标题
      tags:
      - Conversations
  /conversations/{id}/messages/{messageId}/tail:
    delete:
      description: 删除目标用户消息以及它之后的全部消息，用于重试和编辑重发。
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      - description: 作为截断起点的用户消息 ID
        in: path
        name: messageId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.TruncateMessagesData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 截断对话消息
      tags:
      - Chat
  /conversations/{id}/pin:
    patch:
      consumes:
      - application/json
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      - description: 置顶状态
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateConversationPinnedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationPinnedData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 修改对话置顶状态
      tags:
      - Conversations
  /conversations/{id}/share:
    delete:
      description: 使指定对话现有的公开分享令牌失效。
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationUnshareData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 关闭公开分享
      tags:
      - Shares
    post:
      description: 为当前用户的指定对话创建或返回公开分享令牌。
      parameters:
      - description: 对话 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ConversationShareData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: 创建公开分享
      tags:
      - Shares
  /conversations/batch:
    delete:
      consumes:
      - application/json
      description: 删除当前用户选择的多条对话及其全部消息。
      parameters:
      - description: 会话 ID 列表
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/handlers.BatchDeleteConversationsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/handlers.BatchDeleteConversationsData'
              type: object
        "400":
          description: Bad Request
          schema:
